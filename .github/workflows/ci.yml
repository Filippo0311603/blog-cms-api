name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Pin the mongod binary used by mongodb-memory-server (same as the library default)
      # and keep it in a fixed directory (set below, tilde is not expanded in env) so it can be cached.
      # ubuntu-latest is Ubuntu 24.04, for which MongoDB 8.x ships a native build,
      # so the distro is auto-detected and MONGOMS_DISTRO is not needed.
      MONGOMS_VERSION: '8.2.6'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set mongod download directory
        run: echo "MONGOMS_DOWNLOAD_DIR=$HOME/.cache/mongodb-binaries" >> "$GITHUB_ENV"

      - name: Cache mongod binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongod-${{ runner.os }}-${{ env.MONGOMS_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Prettier check
        run: npx prettier --check .

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
