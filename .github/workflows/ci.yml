name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Pin the mongod binary used by mongodb-memory-server (same as the library default)
      # and keep it in a fixed directory (set below, tilde is not expanded in env) so it can be cached.
      # The distro is auto-detected, so MONGOMS_DISTRO is not set. ubuntu-latest moved to
      # Ubuntu 26.04 (kernel 7.0) in October 2026: 8.2.6 starts there, newer 8.x does not
      # (see docker-compose.yml), so keep this version and the compose image in sync.
      MONGOMS_VERSION: '8.2.6'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set mongod download directory
        run: echo "MONGOMS_DOWNLOAD_DIR=$HOME/.cache/mongodb-binaries" >> "$GITHUB_ENV"

      - name: Cache mongod binary
        uses: actions/cache@v6
        with:
          path: ~/.cache/mongodb-binaries
          key: mongod-${{ runner.os }}-${{ env.ImageOS }}-${{ env.MONGOMS_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Prettier check
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # --wait returns once every service with a healthcheck is healthy (mongo, then the API,
      # whose healthcheck is defined in the Dockerfile) and fails if one becomes unhealthy.
      - name: Build and start the stack
        run: docker compose up -d --build --wait --wait-timeout 120

      - name: Smoke test
        run: bash scripts/smoke.sh http://localhost:3000

      - name: Compose diagnostics
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --timestamps
          for c in blogcms-mongo blogcms-api; do
            echo "--- $c state and healthcheck log"
            docker inspect --format '{{json .State}}' "$c" || true
          done

      - name: Stop the stack
        if: always()
        run: docker compose down -v
